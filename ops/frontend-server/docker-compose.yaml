name: somnia-prod
services:
  frontend:
    build:
      context: ../..
      dockerfile: ops/frontend-server/Dockerfile
      args:
        NEXT_PUBLIC_GM_SERVER_URL: ${NEXT_PUBLIC_GM_SERVER_URL:-https://gm.mafiaonchain.live}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-wss://livekit.mafiaonchain.live}
        NEXT_PUBLIC_ACTIVE_NETWORK: ${NEXT_PUBLIC_ACTIVE_NETWORK:-somnia_testnet}
    container_name: somnia-frontend
    restart: unless-stopped
    env_file:
      - ./.env.production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - redis

  gm-server:
    build:
      context: ../../../gm-server
      dockerfile: Dockerfile
    container_name: somnia-gm
    restart: unless-stopped
    env_file:
      - path: ../../../gm-server/.env
        required: false
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: somnia-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - somnia_redis_data:/data

volumes:
  somnia_redis_data:
