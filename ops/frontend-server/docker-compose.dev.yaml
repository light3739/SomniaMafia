name: mafia-dev
services:
  frontend:
    image: ghcr.io/light3739/somniamafia:dev
    container_name: mafia-frontend-dev
    restart: unless-stopped
    env_file:
      - ./.env.dev
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - redis

  gm-server:
    image: ghcr.io/light3739/somnia-mafia-gm-server:dev
    container_name: mafia-gm-dev
    restart: unless-stopped
    env_file:
      - path: ../../../gm-server/.env
        required: false
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: mafia-redis-dev
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - mafia_redis_dev:/data

volumes:
  mafia_redis_dev:
