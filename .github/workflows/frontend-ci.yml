name: Frontend CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit --pretty false

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_GM_SERVER_URL: https://gm-test.mafiaonchain.live
          NEXT_PUBLIC_LIVEKIT_URL: wss://livekit.mafiaonchain.live
          NEXT_PUBLIC_ACTIVE_NETWORK: somnia_testnet
