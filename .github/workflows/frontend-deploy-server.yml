name: Frontend Deploy Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Notify start (Telegram)
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d text="🚀 Frontend PROD deploy started: ${{ github.repository }} @ ${{ github.sha }}"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Get Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build frontend
        run: npm run build
        env:
          NEXT_PUBLIC_GM_SERVER_URL: https://gm.mafiaonchain.live
          NEXT_PUBLIC_LIVEKIT_URL: wss://livekit.mafiaonchain.live
          NEXT_PUBLIC_ACTIVE_NETWORK: somnia_mainnet
          NEXT_PUBLIC_MAFIA_DIAMOND: ${{ vars.NEXT_PUBLIC_MAFIA_DIAMOND }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ops/frontend-server/Dockerfile
          push: true
          tags: ghcr.io/light3739/somniamafia:latest

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GM_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          PORT="${{ secrets.GM_SSH_PORT }}"
          if [ -z "$PORT" ]; then PORT=22; fi
          ssh-keyscan -p "$PORT" -H "${{ secrets.GM_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to prod server
        env:
          SSH_HOST: ${{ secrets.GM_SSH_HOST }}
          SSH_USER: ${{ secrets.GM_SSH_USER }}
          SSH_PORT: ${{ secrets.GM_SSH_PORT }}
          REMOTE_DIR: ${{ secrets.FRONT_REMOTE_DIR }}
        run: |
          HOST="${SSH_HOST}"
          USER="${SSH_USER:-root}"
          PORT="${SSH_PORT:-22}"
          REMOTE="${REMOTE_DIR:-/root/somnia-frontend}"

          echo "📦 Updating compose file on remote..."
          scp -P "$PORT" ops/frontend-server/docker-compose.yaml "${USER}@${HOST}:${REMOTE}/ops/frontend-server/docker-compose.yaml"

          echo "🔄 Pulling and restarting containers..."
          ssh -p "$PORT" "${USER}@${HOST}" "
            cd '${REMOTE}/ops/frontend-server' && \
            docker compose pull frontend && \
            docker compose up -d frontend
          "

      - name: Health check
        env:
          PROD_URL: ${{ vars.PROD_FRONTEND_URL }}
        run: |
          URL="${PROD_URL:-https://mafiaonchain.live}"
          echo "🏥 Checking ${URL}..."
          sleep 10
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${URL}" || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed (attempt $i)"
              exit 0
            fi
            echo "⏳ Attempt $i: status=$STATUS, retrying in 10s..."
            sleep 10
          done
          echo "❌ Health check failed after 5 attempts"
          exit 1

      - name: Notify success (Telegram)
        if: success()
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d text="✅ Frontend PROD deploy success: ${{ github.repository }} @ ${{ github.ref_name }}"
          fi

      - name: Notify failure (Telegram)
        if: failure()
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d text="❌ Frontend PROD deploy FAILED: ${{ github.repository }} @ ${{ github.ref_name }} | run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
