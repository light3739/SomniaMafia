name: GM Deploy Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Notify start (Telegram)
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d text="🚀 GM dev deploy started: ${{ github.repository }} @ ${{ github.ref_name }} | commit ${{ github.sha }}"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GM_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          PORT="${{ secrets.GM_SSH_PORT }}"
          if [ -z "$PORT" ]; then PORT=22; fi
          ssh-keyscan -p "$PORT" -H "${{ secrets.GM_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build frontend checks
        run: |
          npm ci --legacy-peer-deps
          npx tsc --noEmit --pretty false

      - name: Sync + Deploy GM Test
        env:
          GM_SOURCE_DIR: ops/gm-server/source
          GM_SSH_HOST: ${{ secrets.GM_SSH_HOST }}
          GM_SSH_USER: ${{ secrets.GM_SSH_USER }}
          GM_SSH_PORT: ${{ secrets.GM_SSH_PORT }}
          GM_REMOTE_DIR: /root/gm-server-test
          GM_PM2_NAME: gm-server-test
        run: |
          npm run gm:sync
          npm run gm:build
          npm run gm:deploy:test

      - name: Notify success (Telegram)
        if: ${{ success() }}
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d text="✅ GM dev deploy success: ${{ github.repository }} @ ${{ github.ref_name }} | https://gm-test.mafiaonchain.live"
          fi

      - name: Notify failure (Telegram)
        if: ${{ failure() }}
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d text="❌ GM dev deploy FAILED: ${{ github.repository }} @ ${{ github.ref_name }} | run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
