name: Frontend Deploy Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Notify start (Telegram)
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d text="🚀 Frontend dev build & deploy started: ${{ github.repository }} @ ${{ github.ref_name }}"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Get Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build frontend
        run: npm run build
        env:
          NEXT_PUBLIC_GM_SERVER_URL: https://gm-test.mafiaonchain.live
          NEXT_PUBLIC_DAILY_DOMAIN: ${{ vars.NEXT_PUBLIC_DAILY_DOMAIN }}
          NEXT_PUBLIC_ACTIVE_NETWORK: somnia_testnet
          NEXT_PUBLIC_MAFIA_DIAMOND: ${{ vars.NEXT_PUBLIC_MAFIA_DIAMOND }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ops/frontend-server/Dockerfile
          push: true
          tags: ghcr.io/light3739/somniamafia:dev
          build-args: |
            NEXT_PUBLIC_GM_SERVER_URL=https://gm-test.mafiaonchain.live
            NEXT_PUBLIC_DAILY_DOMAIN=${{ vars.NEXT_PUBLIC_DAILY_DOMAIN }}
            NEXT_PUBLIC_ACTIVE_NETWORK=somnia_testnet

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GM_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          HOST="${{ secrets.MAFIATEST_SSH_HOST }}"
          if [ -z "$HOST" ]; then HOST="${{ secrets.GM_SSH_HOST }}"; fi
          PORT="${{ secrets.GM_SSH_PORT }}"
          if [ -z "$PORT" ]; then PORT=22; fi
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts

      - name: Deploy to test server
        env:
          FRONT_SSH_HOST: ${{ secrets.MAFIATEST_SSH_HOST }}
          FRONT_SSH_USER: ${{ secrets.GM_SSH_USER }}
          FRONT_SSH_PORT: ${{ secrets.GM_SSH_PORT }}
          FRONT_REMOTE_DIR: /root/mafia-dev/frontend
          DAILY_API_KEY: ${{ secrets.DAILY_API_KEY }}
          NEXT_PUBLIC_DAILY_DOMAIN: ${{ vars.NEXT_PUBLIC_DAILY_DOMAIN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${FRONT_SSH_HOST}" ]; then
            export FRONT_SSH_HOST="${{ secrets.GM_SSH_HOST }}"
          fi
          if [ -z "${FRONT_SSH_USER}" ]; then
            export FRONT_SSH_USER=root
          fi
          if [ -z "${FRONT_SSH_PORT}" ]; then
            export FRONT_SSH_PORT=22
          fi

          echo "🚀 Updating docker-compose.dev.yaml on remote..."
          # Securely transfer only the compose file
          scp -P ${FRONT_SSH_PORT} ops/frontend-server/docker-compose.dev.yaml ${FRONT_SSH_USER}@${FRONT_SSH_HOST}:${FRONT_REMOTE_DIR}/ops/frontend-server/docker-compose.dev.yaml

          echo "🔐 Syncing Daily env vars into remote .env.dev..."
          ssh -p ${FRONT_SSH_PORT} ${FRONT_SSH_USER}@${FRONT_SSH_HOST} "
            set -e
            ENV_FILE='${FRONT_REMOTE_DIR}/ops/frontend-server/.env.dev'
            touch \$ENV_FILE
            for PAIR in 'DAILY_API_KEY=${DAILY_API_KEY}' 'NEXT_PUBLIC_DAILY_DOMAIN=${NEXT_PUBLIC_DAILY_DOMAIN}' 'TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}' 'TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}'; do
              KEY=\${PAIR%%=*}
              if grep -q \"^\${KEY}=\" \"\$ENV_FILE\"; then
                sed -i \"s|^\${KEY}=.*|\${PAIR}|\" \"\$ENV_FILE\"
              else
                echo \"\${PAIR}\" >> \"\$ENV_FILE\"
              fi
            done
            chmod 600 \"\$ENV_FILE\"
          "

          echo "🔄 Pulling and restarting containers on remote..."
          ssh -p ${FRONT_SSH_PORT} ${FRONT_SSH_USER}@${FRONT_SSH_HOST} "
            cd ${FRONT_REMOTE_DIR} && \
            docker compose -f ops/frontend-server/docker-compose.dev.yaml pull && \
            docker rm -f mafia-frontend-dev mafia-gm-dev mafia-redis-dev || true && \
            docker compose -f ops/frontend-server/docker-compose.dev.yaml up -d
          "

      - name: Sync monitoring credentials
        env:
          FRONT_SSH_HOST: ${{ secrets.MAFIATEST_SSH_HOST }}
          FRONT_SSH_USER: ${{ secrets.GM_SSH_USER }}
          FRONT_SSH_PORT: ${{ secrets.GM_SSH_PORT }}
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          HOST="${FRONT_SSH_HOST:-${{ secrets.GM_SSH_HOST }}}"
          USER="${FRONT_SSH_USER:-root}"
          PORT="${FRONT_SSH_PORT:-22}"
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            ssh -p "$PORT" "${USER}@${HOST}" "
              sed -i 's|^TELEGRAM_BOT_TOKEN=.*|TELEGRAM_BOT_TOKEN=${TG_BOT_TOKEN}|' /etc/mafia-monitor.env
              sed -i 's|^TELEGRAM_CHAT_ID=.*|TELEGRAM_CHAT_ID=${TG_CHAT_ID}|' /etc/mafia-monitor.env
            "
            echo "✅ Monitoring credentials synced"
          fi

      - name: Health check
        run: |
          echo "🏥 Checking https://mafiaonchain.live..."
          sleep 10
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://mafiaonchain.live" || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed (attempt $i)"
              exit 0
            fi
            echo "⏳ Attempt $i: status=$STATUS, retrying in 10s..."
            sleep 10
          done
          echo "❌ Health check failed after 5 attempts"
          exit 1

      - name: Notify success (Telegram)
        if: success()
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d text="✅ Frontend dev deploy success: ${{ github.repository }} @ ${{ github.ref_name }} | https://mafiaonchain.live"
          fi

      - name: Notify failure (Telegram)
        if: failure()
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d text="❌ Frontend dev deploy FAILED: ${{ github.repository }} @ ${{ github.ref_name }} | run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
