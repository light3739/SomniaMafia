name: Frontend Deploy Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Notify start (Telegram)
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d text="🚀 Frontend dev deploy started: ${{ github.repository }} @ ${{ github.ref_name }} | ${{ github.sha }}"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GM_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          HOST="${{ secrets.MAFIATEST_SSH_HOST }}"
          if [ -z "$HOST" ]; then HOST="${{ secrets.GM_SSH_HOST }}"; fi
          PORT="${{ secrets.GM_SSH_PORT }}"
          if [ -z "$PORT" ]; then PORT=22; fi
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts

      - name: Deploy frontend to test server
        env:
          FRONT_SSH_HOST: ${{ secrets.MAFIATEST_SSH_HOST }}
          FRONT_SSH_USER: ${{ secrets.GM_SSH_USER }}
          FRONT_SSH_PORT: ${{ secrets.GM_SSH_PORT }}
          FRONT_REMOTE_DIR: /root/mafia-dev/frontend
        run: |
          # Fall back to GM_SSH_HOST if MAFIATEST_SSH_HOST is not set
          if [ -z "${FRONT_SSH_HOST}" ]; then
            export FRONT_SSH_HOST="${{ secrets.GM_SSH_HOST }}"
          fi
          if [ -z "${FRONT_SSH_USER}" ]; then
            export FRONT_SSH_USER=root
          fi
          if [ -z "${FRONT_SSH_PORT}" ]; then
            export FRONT_SSH_PORT=22
          fi
          
          echo "🚀 Packaging and uploading files to ${FRONT_SSH_HOST}..."
          # Create a tarball to avoid issues with missing rsync and to exclude unwanted folders
          tar -czf frontend.tar.gz --exclude='.git' --exclude='node_modules' --exclude='.next' ./
          
          scp -P ${FRONT_SSH_PORT} frontend.tar.gz ${FRONT_SSH_USER}@${FRONT_SSH_HOST}:${FRONT_REMOTE_DIR}/
          
          echo "🔄 Extracting and restarting containers on remote..."
          ssh -p ${FRONT_SSH_PORT} ${FRONT_SSH_USER}@${FRONT_SSH_HOST} "cd ${FRONT_REMOTE_DIR} && tar -xzf frontend.tar.gz && rm frontend.tar.gz && docker-compose -f ops/frontend-server/docker-compose.dev.yaml up -d --build"

      - name: Notify success (Telegram)
        if: success()
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d text="✅ Frontend dev deploy success: ${{ github.repository }} @ ${{ github.ref_name }} | https://test.mafiaonchain.live"
          fi

      - name: Notify failure (Telegram)
        if: failure()
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d text="❌ Frontend dev deploy FAILED: ${{ github.repository }} @ ${{ github.ref_name }} | run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
